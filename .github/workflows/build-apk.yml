name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cal-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, lint, and package Cal
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        # "yes" can receive SIGPIPE after sdkmanager finishes; don't let that
        # harmless pipe exit code fail the entire job.
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Install required Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK installation
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --list_installed
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle and Java versions
        run: |
          java -version
          gradle --version

      - name: Compile debug Kotlin and resources
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK package
        run: test -s app/build/outputs/apk/debug/app-debug.apk && unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
